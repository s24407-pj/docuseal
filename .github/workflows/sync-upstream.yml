name: Sync Upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_tag:
        description: 'Force sync for a specific tag (for testing)'
        required: false
        type: string

permissions: write-all

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pl
        uses: actions/checkout@v4
        with:
          ref: pl
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/docusealco/docuseal.git
          git fetch upstream --tags --force

      - name: Check for new upstream version
        id: check
        run: |
          FORCE_TAG="${{ inputs.force_tag }}"
          if [ -n "$FORCE_TAG" ]; then
            echo "upstream_tag=$FORCE_TAG" >> "$GITHUB_OUTPUT"
            echo "new_version=true" >> "$GITHUB_OUTPUT"
            echo "Wymuszony tag: $FORCE_TAG"
            exit 0
          fi

          UPSTREAM_TAG=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"

          if git ls-remote --tags origin "refs/tags/$UPSTREAM_TAG" | grep -q .; then
            echo "new_version=false" >> "$GITHUB_OUTPUT"
            echo "Już zsynchronizowano: $UPSTREAM_TAG"
          else
            echo "new_version=true" >> "$GITHUB_OUTPUT"
            echo "Nowa wersja upstream: $UPSTREAM_TAG"
          fi

      - name: Point upstream-mirror at upstream release tag (clean mirror)
        if: steps.check.outputs.new_version == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.check.outputs.upstream_tag }}"

          TAG_COMMIT=$(git rev-parse "${TAG}^{commit}")
          git push origin "${TAG_COMMIT}:refs/heads/upstream-mirror" --force

      - name: Push upstream tag to origin
        if: steps.check.outputs.new_version == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.check.outputs.upstream_tag }}"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists on origin, skipping tag push"
          else
            git push origin "refs/tags/${TAG}"
          fi

      - name: Merge upstream tag into upstream-merge branch
        if: steps.check.outputs.new_version == 'true'
        id: merge
        run: |
          set -euo pipefail
          TAG="${{ steps.check.outputs.upstream_tag }}"
          BRANCH="upstream-merge/${TAG}"

          git checkout -B "${BRANCH}" pl

          set +e
          git merge --no-ff --no-edit -m "chore: sync upstream ${TAG}" "refs/tags/${TAG}"
          MERGE_STATUS=$?
          set -e

          if [ "$MERGE_STATUS" -ne 0 ]; then
            git add -A
            git commit -m "chore: sync upstream ${TAG} (conflicts — manual resolve)"
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            echo "Wykryto konflikty przy merge upstream ${TAG} -> pl"
          else
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
            echo "Czysty merge upstream ${TAG} -> pl"
          fi

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          git push origin "${BRANCH}" --force-with-lease

      - name: Open or update PR upstream-merge -> pl
        if: steps.check.outputs.new_version == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.check.outputs.upstream_tag }}"
          BRANCH="${{ steps.merge.outputs.branch }}"
          CONFLICTS="${{ steps.merge.outputs.conflicts }}"

          if [ "${CONFLICTS}" = "true" ]; then
            BODY=$(printf 'Automatyczny sync upstream DocuSeal `%s` do brancha pl.\n\nUWAGA: wykryto konflikty — branch zawiera markery konfliktów. Rozwiąż ręcznie przed mergem.' "${TAG}")
          else
            BODY="Automatyczny sync upstream DocuSeal \`${TAG}\` do brancha pl."
          fi

          EXISTING_PR=$(gh pr list --head "${BRANCH}" --base pl --state open --json number -q '.[0].number' || echo "")

          if [ -n "${EXISTING_PR}" ]; then
            PR_NUMBER="${EXISTING_PR}"
            echo "Istniejący PR #${PR_NUMBER} dla brancha ${BRANCH}"
          else
            gh pr create \
              --base pl \
              --head "${BRANCH}" \
              --title "chore: sync upstream ${TAG}" \
              --body "${BODY}"
            PR_NUMBER=$(gh pr list --head "${BRANCH}" --base pl --state open --json number -q '.[0].number')
          fi

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Auto-merge PR -> pl
        if: steps.check.outputs.new_version == 'true' && steps.merge.outputs.conflicts == 'false'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.create_pr.outputs.pr_number }}"

          if [ "${PR_NUMBER}" = "null" ] || [ -z "${PR_NUMBER}" ]; then
            echo "No open PR to merge"
            exit 0
          fi

          set +e
          OUT="$(gh pr merge "${PR_NUMBER}" --merge --delete-branch 2>&1)"
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "$OUT"
            exit 0
          fi

          echo "$OUT" >&2
          if echo "$OUT" | grep -qiE 'merge conflict|conflicting|not mergeable|Review required|blocked|required'; then
            echo "Merge zatrzymany (konflikty albo branch protection). PR #${PR_NUMBER} zostaje otwarty do ręcznego dokończenia."
            exit 0
          fi

          exit "$STATUS"

      - name: Note conflicts (no auto-merge)
        if: steps.check.outputs.new_version == 'true' && steps.merge.outputs.conflicts == 'true'
        run: |
          echo "PR #${{ steps.create_pr.outputs.pr_number }} otwarty z konfliktami — auto-merge pominięty."
