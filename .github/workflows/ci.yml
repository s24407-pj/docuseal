---
name: CI
on:
  pull_request:
    branches:
      - pl

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rubocop:
    name: Rubocop
    runs-on: [self-hosted, Linux, X64, docuseal-ci]
    timeout-minutes: 10
    container:
      image: ruby:4.0.10-alpine
      volumes:
        - /home/michal/actions-runners/docuseal/local-cache/bundle:/cache/bundle
    env:
      BUNDLE_PATH: /cache/bundle
    steps:
      - name: Install packages
        run: apk add --no-cache build-base git yaml-dev
      - uses: actions/checkout@v4
      - name: Install gems
        run: |
          gem install bundler
          bundle check || bundle install --jobs 4 --retry 4
      - name: Run RuboCop
        run: bundle exec rubocop

  erblint:
    name: Erblint
    runs-on: [self-hosted, Linux, X64, docuseal-ci]
    timeout-minutes: 10
    container:
      image: ruby:4.0.10-alpine
      volumes:
        - /home/michal/actions-runners/docuseal/local-cache/bundle:/cache/bundle
    env:
      BUNDLE_PATH: /cache/bundle
    steps:
      - name: Install packages
        run: apk add --no-cache build-base git yaml-dev
      - uses: actions/checkout@v4
      - name: Install gems
        run: |
          gem install bundler
          bundle check || bundle install --jobs 4 --retry 4
      - name: Run Erblint
        run: bundle exec erb_lint ./app

  eslint:
    name: ESLint
    runs-on: [self-hosted, Linux, X64, docuseal-ci]
    timeout-minutes: 10
    container:
      image: node:20.19.0-alpine
      volumes:
        - /home/michal/actions-runners/docuseal/local-cache/yarn:/cache/yarn
    env:
      YARN_CACHE_FOLDER: /cache/yarn
    steps:
      - name: Install packages
        run: apk add --no-cache git
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run eslint
        run: ./node_modules/eslint/bin/eslint.js "app/javascript/**/*.js"

  brakeman:
    name: Brakeman
    runs-on: [self-hosted, Linux, X64, docuseal-ci]
    timeout-minutes: 10
    container:
      image: ruby:4.0.10-alpine
      volumes:
        - /home/michal/actions-runners/docuseal/local-cache/bundle:/cache/bundle
        - /home/michal/actions-runners/docuseal/local-cache/yarn:/cache/yarn
    env:
      BUNDLE_PATH: /cache/bundle
      YARN_CACHE_FOLDER: /cache/yarn
    steps:
      - name: Install packages
        run: apk add --no-cache build-base git yaml-dev nodejs yarn vips leptonica
      - uses: actions/checkout@v4
      - name: Install gems
        run: |
          gem install bundler
          bundle check || bundle install --jobs 4 --retry 4
          yarn install --frozen-lockfile
      - name: Run Brakeman
        run: bundle exec brakeman -q --exit-on-warn

  rspec:
    name: RSpec
    runs-on: [self-hosted, Linux, X64, docuseal-ci]
    timeout-minutes: 15
    container:
      image: ruby:4.0.10-alpine
      volumes:
        - /home/michal/actions-runners/docuseal/local-cache/bundle:/cache/bundle
        - /home/michal/actions-runners/docuseal/local-cache/yarn:/cache/yarn
    env:
      BUNDLE_PATH: /cache/bundle
      YARN_CACHE_FOLDER: /cache/yarn

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docuseal_test
        options: >-
          --health-cmd "pg_isready -U postgres -d docuseal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install packages
        run: apk add --no-cache build-base git libpq-dev yaml-dev nodejs yarn wget unzip vips leptonica chromium
      - uses: actions/checkout@v4
      - name: Install dependencies
        env:
          RAILS_ENV: test
        run: |
          gem install bundler
          bundle check || bundle install --jobs 4 --retry 4
          yarn install --frozen-lockfile
          wget -O pdfium-linux.zip "https://github.com/docusealco/pdfium-binaries/releases/latest/download/pdfium-musl-$(uname -m).zip"
          unzip -q pdfium-linux.zip -d /tmp/pdfium-linux
          cp /tmp/pdfium-linux/lib/libpdfium.so /usr/lib/libpdfium.so
          rm -rf pdfium-linux.zip /tmp/pdfium-linux
      - name: Run
        env:
          RAILS_ENV: test
          NODE_ENV: test
          COVERAGE: true
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/docuseal_test
        run: |
          bundle exec rake db:create
          bundle exec rake db:migrate
          bundle exec rake assets:precompile
          bundle exec rspec
